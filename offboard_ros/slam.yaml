# slam_toolbox (online, asynchronous) for the LanderPi's 360° lidar.
# Frames as published by the robot: odom -> base_footprint -> ... -> lidar_frame.
slam_toolbox:
  ros__parameters:
    use_sim_time: true            # /clock comes from the robot's stamps (relay.py)
    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    resolution: 0.05              # 5 cm grid cells
    max_laser_range: 12.0         # the lidar sees ~25 m; indoors 12 m keeps the map clean
    # 0: slam_toolbox's own pre-check looks at distance only, so with 0.1 it ignored every scan
    # while the robot turned on the spot (mecanum odometry: position exactly constant) and the
    # map did not grow during the exploration's look-around turn (reproduced with
    # offboard_ros/replay_slam.py, 2026-10-02). Now the heading threshold and
    # minimum_time_interval (0.5 s) decide.
    minimum_travel_distance: 0.0
    minimum_travel_heading: 0.15  # add a scan after ~9 degrees of turning
    map_update_interval: 2.0      # republish /map every 2 s
    transform_publish_period: 0.05
    transform_timeout: 0.5
    # scans wait for the robot's pose (TF) at their time stamp, which arrives 30-70 ms later over
    # Wi-Fi; with the default queue of 1, every late pose dropped scans and the map stopped
    # updating (seen during the exploration's look-around turn, 2026-10-02)
    scan_queue_size: 10
    tf_buffer_duration: 30.0
    throttle_scans: 1
    use_scan_matching: true
    use_scan_barycenter: true
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
    debug_logging: false
    enable_interactive_mode: false
