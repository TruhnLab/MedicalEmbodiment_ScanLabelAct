[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "landerpi"
version = "0.1.0"
description = "Laptop-side tools for the Hiwonder LanderPi: rosbridge client and shared robot definitions"
requires-python = ">=3.11"
dependencies = ["numpy", "websockets>=13"]

[tool.setuptools]
packages = ["landerpi"]
